name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI only typechecks and runs unit tests; no need to download the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Same high/critical bar as `npm audit --audit-level=high`, but advisories with no safe
      # fix can be waived with a reason and a review date instead of leaving CI permanently red.
      - run: node scripts/audit-gate.mjs
      - run: npm run typecheck
      - run: npm test
